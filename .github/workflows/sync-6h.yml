# Every six hours: the steps that spend provider quota. The cadence is what
# capture_odds.py's own docstring recommends, and it keeps both APIs well
# inside their daily limits (ingest_current_results is capped at 15 requests
# per run by --max-requests).
name: Sync odds and results (6-hourly)

on:
  schedule:
    # GitHub cron is UTC: 00:40, 06:40, 12:40 and 18:40 UTC are
    # 02:40, 08:40, 14:40 and 20:40 SAST.
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days back to look for unresolved priced fixtures"
        required: false
        default: "3"

concurrency:
  group: oddsmith-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Results first: settling what has finished is worth more than pricing
      # what hasn't, and it still runs if the odds capture later hits a limit.
      - name: Ingest completed results and settle slips and personal pool
        run: |
          uv run python scripts/ingest_current_results.py \
            --lookback-days "${{ inputs.lookback_days || '3' }}" \
            --write

      # Prices come from a different provider, so a results outage (API-Football
      # refusing every request) must not also stop the odds capture. The job
      # still ends failed, which is what flags the outage.
      - name: Capture a fresh window of prices
        if: ${{ !cancelled() }}
        run: uv run python scripts/capture_odds.py --days 3

      # Research collection only: these prices are stored and settled, but are
      # intentionally unavailable to the model and generated tickets.
      - name: Capture corner-total prices for research
        if: ${{ !cancelled() }}
        run: |
          uv run python scripts/capture_odds.py --days 3 \
            --markets corner_totals \
            --max-additional-events 5 \
            --max-additional-credits 10 \
            --additional-optional
